# Brodeuse CNC Singer -- configuration FluidNC
#
# Materiel :
#   Controleur  ESP32-WROOM-32 DevKitC 38 broches (CP2102)
#   Adaptation  74HCT245 pour convertir les sorties 3,3 V en 5 V
#   Axe Z       Nema 23 3 N.m + driver DM542, alim 48 V
#   Axes X/Y    Nema 17 + drivers DM320S, alim 24 V
#
# ATTENTION -- deux alimentations distinctes sont obligatoires.
# Les DM320S acceptent 10-30 V et grilleraient en 48 V.
#
# Convention de l'axe Z : rotatif, exprime en DEGRES D'ARBRE PRINCIPAL.
#   1 point de broderie = 360 deg = 1 tour complet de l'arbre.
#   Le rapport de reduction 2:1 est absorbe par steps_per_mm ci-dessous.

name: "Brodeuse Singer CNC"
board: "ESP32 DevKitC 38 broches"

stepping:
  engine: RMT
  # 255 = les moteurs restent alimentes en permanence. Indispensable ici :
  # entre deux points, le cadre doit tenir sa position au centieme.
  idle_ms: 255
  # Les DM542/DM320S sont optocouples : il leur faut des impulsions LARGES.
  # 4 us est un point de depart sur; descends progressivement si tu veux
  # plus de vitesse, mais des pas manques viennent presque toujours d'ici.
  pulse_us: 4
  dir_delay_us: 5
  disable_delay_us: 0

# --------------------------------------------------------------------------
# Axes
# --------------------------------------------------------------------------
axes:
  # Un seul signal ENABLE partage par les quatre drivers.
  # PAS de suffixe :low. Sur les DM320S/DM542, alimenter l'optocoupleur ENA
  # DESACTIVE le driver. FluidNC doit donc mettre la ligne au niveau haut
  # pour desactiver, et au niveau bas pour activer -- c'est le comportement
  # par defaut, sans attribut.
  shared_stepper_disable_pin: gpio.13

  # ---- X ---------------------------------------------------------------
  # Nema 17, 1/16 de pas (3200 pas/tour), poulie GT2 20 dents (40 mm/tour)
  #   steps_per_mm = 3200 / 40 = 80        -> resolution 0,0125 mm
  x:
    steps_per_mm: 80.000
    # 200 mm/s
    max_rate_mm_per_min: 12000.000
    # a monter apres essais (voir docs)
    acceleration_mm_per_sec2: 3000.000
    # Course reelle mesuree le 05/08/2026 : 172 mm entre l'origine machine
    # et la butee mecanique. On retire 3 mm de marge de securite.
    max_travel_mm: 169.000
    soft_limits: true
    homing:
      cycle: 2
      positive_direction: false
      mpos_mm: 0.000
      feed_mm_per_min: 300.000
      seek_mm_per_min: 1500.000
      settle_ms: 250
      seek_scaler: 1.100
      feed_scaler: 1.100
    motor0:
      # GPIO 4 : possede un vrai pull-up interne (les 34-39 n'en ont PAS
      # et flottent -- lecon apprise en simulation Wokwi).
      limit_neg_pin: gpio.4:low:pu
      hard_limits: false
      pulloff_mm: 2.000
      standard_stepper:
        step_pin: gpio.26
        direction_pin: gpio.16

  # ---- Y (portique a DEUX moteurs) -------------------------------------
  # Le rail Y porte 2 Nema 17, un de chaque cote, pour eviter que le
  # portique se mette en biais. Leurs 2 drivers DM320S sont cables EN
  # PARALLELE sur les memes signaux Y step / Y dir : les deux moteurs
  # bougent toujours ensemble, FluidNC ne voit qu'un seul axe.
  # (Pas d'auto-equerrage : on regle la perpendicularite mecaniquement.)
  y:
    steps_per_mm: 80.000
    max_rate_mm_per_min: 12000.000
    acceleration_mm_per_sec2: 3000.000
    # Course reelle mesuree le 05/08/2026 : 121 mm, moins 3 mm de marge.
    # C'est Y qui bride le champ de broderie -- voir docs/limites-machine.md
    max_travel_mm: 118.000
    soft_limits: true
    homing:
      cycle: 2
      positive_direction: false
      mpos_mm: 0.000
      feed_mm_per_min: 300.000
      seek_mm_per_min: 1500.000
      settle_ms: 250
      seek_scaler: 1.100
      feed_scaler: 1.100
    motor0:
      limit_neg_pin: gpio.21:low:pu
      hard_limits: false
      # 5 mm et pas 2 : avec 2 mm le levier du microrupteur restait enfonce
      # apres le degagement -> ALARM:8 Homing Fail Pulloff.
      pulloff_mm: 5.000
      standard_stepper:
        step_pin: gpio.25
        direction_pin: gpio.27:low

  # ---- Z (rotatif) -----------------------------------------------------
  # Nema 23, 1/4 de pas (800 pas/tour moteur), reduction 2:1
  #   800 x 2 = 1600 pas par tour d'arbre principal
  #   steps_per_mm = 1600 / 360 = 4,4444 pas par degre
  #
  # Pourquoi 1/4 et pas 1/16 : a 400 points/min et 2:1, le moteur tourne a
  # 800 tr/min. En 1/16 cela ferait 42 700 pas/s. En 1/4 on tombe a
  # 10 700 pas/s, tres confortable. Z n'a aucun besoin de resolution fine.
  z:
    steps_per_mm: 4.4444
    # 600 deg/s = 600 points/min
    max_rate_mm_per_min: 216000.000
    # volant en fonte : montee en vitesse douce
    acceleration_mm_per_sec2: 2000.000
    # 720 deg = 2 tours d'arbre. Comme soft_limits est false, cette valeur ne
    # bride PAS la rotation : elle sert uniquement de garde-fou au homing.
    # Si l'aimant passe devant le Hall sans etre vu, FluidNC abandonne au bout
    # de deux tours au lieu de faire tourner l'arbre indefiniment.
    max_travel_mm: 720.000
    soft_limits: false
    homing:
      # Indexation sur le capteur Hall : amene l'aiguille au point mort haut.
      # Se fait EN PREMIER, avant tout mouvement du cadre.
      cycle: 1
      positive_direction: true
      mpos_mm: 0.000
      # 10 deg/s, lent et precis
      feed_mm_per_min: 3600.000
      # 50 deg/s
      seek_mm_per_min: 18000.000
      settle_ms: 500
      seek_scaler: 1.000
      feed_scaler: 1.000
    motor0:
      # Capteur Hall KY-003 + aimant neodyme 5x2 mm dans la grande poulie.
      # Sortie a collecteur ouvert -> pull-up interne (GPIO 22 en possede un).
      limit_pos_pin: gpio.22:low:pu
      hard_limits: false
      # 10 deg de degagement, valide sur machine le 05/08/2026.
      # 5 deg ne suffisaient pas : l'aimant restait dans le champ du capteur
      # Hall apres le degagement -> ALARM:8 Homing Fail Pulloff.
      # Si l'alarme revient un jour sur Z, c'est ici qu'il faut monter.
      pulloff_mm: 10.000
      standard_stepper:
        step_pin: gpio.17
        # Suffixe :low ajoute le 06/08/2026. L'arbre tournait a l'envers :
        # l'aiguille montait et descendait normalement, mais le crochet
        # passait au mauvais moment et ne saisissait jamais la boucle du fil
        # du haut. Aucun point ne se formait, sans qu'aucune erreur ne
        # s'affiche. Sur une machine a coudre, le volant tourne VERS SOI.
        direction_pin: gpio.14:low

  # ==========================================================================
  # DESACTIVE POUR L'INSTANT -- axe A : servo de debrayage de la tension
  # ==========================================================================
  # Le servo n'est pas encore installe : on ne sait pas ou le fixer sur la
  # machine. La machine tourne donc en 3 axes (X, Y, Z).
  #
  # Pour le reactiver : enlever le '#' devant les lignes ci-dessous, verifier
  # que GPIO 18 est libre, televerser et $Bye.
  #
  # Role : un petit servo (SG90/MG90S) pousse la tige de debrayage des disques
  # de tension de la Singer. Pendant un gros saut, on relache la tension pour
  # que le fil se devide librement sans casser ni tirer le tissu.
  #   A0  = tension serree (repos, position broderie)
  #   A90 = tension relachee (pendant le saut)
  #
  # a:
  #   steps_per_mm: 1.000
  #   max_rate_mm_per_min: 6000.000
  #   acceleration_mm_per_sec2: 5000.000
  #   max_travel_mm: 90.000
  #   soft_limits: false
  #   motor0:
  #     rc_servo:
  #       pwm_hz: 50
  #       output_pin: gpio.18
  #       min_pulse_us: 1000
  #       max_pulse_us: 2000

# ==========================================================================
# DESACTIVE POUR L'INSTANT -- entrees de controle
# ==========================================================================
# Ni le detecteur de casse-fil ni le bouton d'arret d'urgence ne sont encore
# installes. Les declarer alors que les fils ne sont pas cables ferait flotter
# les entrees et provoquerait des declenchements fantomes -- voire le fameux
# "Controller is in a reset loop" sur GPIO 33.
#
# Pour reactiver : enlever le '#', APRES avoir cable les capteurs.
#
# control:
#   # Detecteur de casse-fil : roue libre sur le trajet du fil + capteur Hall.
#   # Si le fil ne defile plus, la machine se met en pause.
#   feed_hold_pin: gpio.32:low:pu
#   # Arret d'urgence : bouton coup-de-poing, contact NO vers la masse.
#   reset_pin: gpio.33:low:pu
#
# GPIO 18, 32 et 33 sont donc libres pour le moment.

# ==========================================================================
# DESACTIVE POUR L'INSTANT -- pedale physique du mode couture
# ==========================================================================
# Le mode couture fonctionne DEJA sans rien de tout ceci : la pedale a
# l'ecran de interface/serveur.py suffit. Ce bloc n'est utile que si tu veux
# un interrupteur au pied cable sur la carte.
#
# Limite a connaitre : une macro FluidNC se declenche sur l'ACTIVATION de
# l'interrupteur, jamais sur son relachement. Un seul contact ne peut donc
# que DEMARRER. Il faut un deuxieme contact pour arreter, ou passer par le
# bouton ARRET de l'interface.
#
# C'est pour cette raison qu'une pedale USB branchee sur le PC est un
# meilleur choix : le navigateur voit l'appui ET le relachement, on retrouve
# le geste d'une vraie machine a coudre.
#
# GPIO 19 est libre (le lecteur SD a ete abandonne au profit du WiFi).
# ATTENTION : si tu ajoutes un jour une carte SD, elle reclamera les GPIO
# 5, 18, 19 et 23 -- il faudra deplacer la pedale sur le 2 ou le 15.
#
# Ne decommente qu'APRES avoir cable l'interrupteur : une broche declaree
# mais laissee en l'air se declenche toute seule.
#
# control:
#   macro0_pin: gpio.19:low:pu
#
# macros:
#   # 1000 points a 100 points/min. Ajuste le F pour changer la cadence :
#   # F = cadence_en_points_par_minute x 360
#   macro0: $J=G91 Z360000 F36000

# --------------------------------------------------------------------------
# Reseau : on brode en WiFi (pas de carte SD)
# --------------------------------------------------------------------------
# Le lecteur SD est abandonne au profit du WiFi : cela libere les GPIO
# 5, 18, 19, 23. Le 18 est reserve au servo, pour quand il sera installe.
#
# Le WiFi se configure par commandes une fois FluidNC flashe (pas dans ce
# YAML), par exemple :
#   $Sta/SSID=MonReseau
#   $Sta/Password=MonMotDePasse
#   $WiFi/Mode=STA
# On envoie ensuite les fichiers G-code via l'interface web (WebUI).

# --------------------------------------------------------------------------
# Divers
# --------------------------------------------------------------------------
start:
  must_home: true
  deactivate_parking: true

# Pas de broche ni de laser sur cette machine.
# L'entrainement de l'aiguille est un axe de mouvement, pas une broche.

