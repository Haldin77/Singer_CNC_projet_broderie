services:
  brodeuse:
    build: .
    container_name: brodeuse
    restart: unless-stopped

    # Ecoute sur toutes les interfaces : accessible depuis le LAN en
    # http://<IP_DU_SERVEUR>:8091, en plus du chemin HTTPS via Tailscale.
    #
    # A savoir : l'interface n'a AUCUNE authentification. Quiconque est sur
    # ce reseau peut lancer une broderie ou deplacer les axes. Sur un LAN
    # domestique sans acces externe (pas de redirection de port sur le
    # routeur -- voir docs/deploiement-serveur.md), c'est le meme niveau de
    # confiance qu'un objet connecte pose sur le reseau du salon.
    #
    # Pour revenir au HTTPS-par-Tailscale uniquement (recommande si le
    # reseau est partage ou moins sur) : remets "127.0.0.1:8091:8091".
    ports:
      - "8091:8091"

    volumes:
      # Le depot lui-meme. Modifier un fichier sur l'hote et redemarrer le
      # conteneur suffit -- pas de reconstruction d'image.
      - /home/dilhan/apps/brodeuse/Singer_CNC_projet_broderie:/app
      # /dev en entier plutot que « devices: ». Un ESP32 qui se reinitialise
      # disparait puis revient sous un nouveau noeud ; avec « devices: », le
      # noeud est fige a la creation du conteneur et la liaison reste morte
      # jusqu'au redemarrage. Avec /dev monte, la reconnexion est vue.
      - /dev:/dev

    # Autorise l'ouverture des tty USB sans passer le conteneur en
    # privileged. 188 = ttyUSB (CP210x de la carte), 166 = ttyACM.
    device_cgroup_rules:
      - 'c 188:* rmw'
      - 'c 166:* rmw'

    # 20 = groupe « dialout » sur Ubuntu, proprietaire des ports serie.
    # A verifier sur l'hote : getent group dialout
    group_add:
      - "20"

    command: >
      python serveur.py
      --port 8091
      --fluidnc /dev/brodeuse-carte
      --pedale /dev/brodeuse-pedale
